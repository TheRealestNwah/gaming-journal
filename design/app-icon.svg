<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#8A3717"/>
      <stop offset="0.55" stop-color="#5A2412"/>
      <stop offset="1" stop-color="#2A0F06"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E3A18"/>
      <stop offset="1" stop-color="#5C2310"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E1007"/>
      <stop offset="1" stop-color="#4A1B0B"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9D8B8"/>
      <stop offset="1" stop-color="#C9B28A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D77A"/>
      <stop offset="0.5" stop-color="#E0B84A"/>
      <stop offset="1" stop-color="#B8892A"/>
    </linearGradient>
    <linearGradient id="flameOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE39A"/>
      <stop offset="0.45" stop-color="#F2B24A"/>
      <stop offset="1" stop-color="#D9622B"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6D8"/>
      <stop offset="1" stop-color="#F7B34C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F2A541" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F2A541" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Book shadow -->
  <rect x="262" y="196" width="540" height="690" rx="36" fill="#1A0803" opacity="0.45"/>

  <!-- Page edges (right side) -->
  <rect x="720" y="182" width="74" height="672" rx="20" fill="url(#pages)"/>
  <g stroke="#B39B72" stroke-width="3" opacity="0.7">
    <line x1="738" y1="214" x2="738" y2="822"/>
    <line x1="752" y1="208" x2="752" y2="828"/>
    <line x1="766" y1="204" x2="766" y2="832"/>
  </g>

  <!-- Cover -->
  <rect x="236" y="164" width="520" height="700" rx="34" fill="url(#cover)"/>
  <!-- Spine -->
  <rect x="236" y="164" width="84" height="700" rx="30" fill="url(#spine)"/>
  <rect x="300" y="164" width="20" height="700" fill="#3A1409"/>
  <g stroke="#C9A24A" stroke-width="5" opacity="0.8">
    <line x1="252" y1="260" x2="304" y2="260"/>
    <line x1="252" y1="276" x2="304" y2="276"/>
    <line x1="252" y1="752" x2="304" y2="752"/>
    <line x1="252" y1="768" x2="304" y2="768"/>
  </g>

  <!-- Tooled borders -->
  <rect x="356" y="208" width="358" height="612" rx="18" fill="none" stroke="url(#gold)" stroke-width="10"/>
  <rect x="378" y="230" width="314" height="568" rx="10" fill="none" stroke="#E0B84A" stroke-width="3" opacity="0.75"/>

  <!-- Corner diamonds -->
  <g fill="url(#gold)">
    <path d="M378 230 l16 -16 l16 16 l-16 16 z" transform="translate(-16 16)"/>
    <path d="M692 230 l16 -16 l16 16 l-16 16 z" transform="translate(-32 16)"/>
    <path d="M378 798 l16 -16 l16 16 l-16 16 z" transform="translate(-16 -16)"/>
    <path d="M692 798 l16 -16 l16 16 l-16 16 z" transform="translate(-32 -16)"/>
  </g>

  <!-- Flame glow -->
  <circle cx="535" cy="520" r="200" fill="url(#glow)"/>

  <!-- Flame -->
  <path d="M535 318
           C600 392 640 452 634 536
           C628 626 580 680 535 690
           C490 680 442 626 436 536
           C432 478 456 436 484 398
           C488 440 506 466 528 474
           C534 420 520 368 535 318 Z"
        fill="url(#flameOuter)"/>
  <path d="M537 482
           C572 524 588 566 578 612
           C570 648 552 666 536 670
           C518 666 500 648 494 614
           C488 578 506 540 537 482 Z"
        fill="url(#flameInner)"/>
  <ellipse cx="528" cy="630" rx="16" ry="26" fill="#FFFBEA" opacity="0.8"/>

  <!-- Embers rising -->
  <g fill="#FFCF7A">
    <circle cx="612" cy="300" r="9" opacity="0.9"/>
    <circle cx="470" cy="276" r="6" opacity="0.7"/>
    <circle cx="648" cy="240" r="5" opacity="0.6"/>
    <circle cx="560" cy="248" r="4" opacity="0.5"/>
  </g>
</svg>
