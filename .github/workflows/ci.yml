name: CI

# Runs on pull requests only: main is protected, so every change is tested on
# its PR before it lands. Use "Run workflow" to test main by hand.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Docs-only changes skip the macOS job. A skipped job still satisfies
      # the required "Build & test (iOS Simulator)" check.
      - name: Filter
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qvE '^docs/|\.md$|^LICENSE$|^\.gitignore$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: skipping the iOS build."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: Build & test (iOS Simulator)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build and test native Mac
        run: |
          set -o pipefail
          xcodebuild test \
            -project GamingJournal.xcodeproj -scheme "Hearthbound (Mac)" \
            -destination 'platform=macOS' -derivedDataPath build-mac \
            -parallel-testing-enabled NO -resultBundlePath MacResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee mac-test.log | grep -E "Test Case|error:|failed|passed|\*\*" || true
          grep -qE "TEST (EXECUTE )?SUCCEEDED" mac-test.log

      # Boot the simulator in the background so it is ready by the time the
      # build finishes, instead of xcodebuild booting it before the tests.
      - name: Pick and boot an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          nohup xcrun simctl bootstatus "$UDID" -b > boot.log 2>&1 &

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project GamingJournal.xcodeproj \
            -scheme GamingJournal \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: unre|BUILD|Compiling|\*\*" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Wait for simulator
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      # Unit and UI smoke tests in one run on the already-booted simulator.
      # Parallel testing is off: it clones the simulator, which costs minutes
      # while the whole suite takes seconds.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project GamingJournal.xcodeproj \
            -scheme GamingJournal \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "Test Case|error:|failed|passed|\*\*" || true
          grep -qE "TEST (EXECUTE )?SUCCEEDED" test.log

      # Reuse the simulator build. Boot and run iPad after iPhone, without clones.
      - name: Pick and boot an iPad simulator
        id: ipad
        run: |
          xcrun simctl shutdown "${{ steps.sim.outputs.udid }}"
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[] | .[] | select(.name | startswith("iPad"))][0].udid')
          test "$UDID" != null
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$UDID" -b

      - name: Test iPad
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project GamingJournal.xcodeproj -scheme GamingJournal \
            -destination "platform=iOS Simulator,id=${{ steps.ipad.outputs.udid }}" \
            -derivedDataPath build -parallel-testing-enabled NO \
            -only-testing:GamingJournalUITests \
            -resultBundlePath IPadResults.xcresult CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ipad-test.log | grep -E "Test Case|error:|failed|passed|\*\*" || true
          grep -qE "TEST (EXECUTE )?SUCCEEDED" ipad-test.log

      - name: Collect Mac launch diagnostics
        if: failure()
        run: |
          plutil -p build-mac/Build/Products/Debug/Hearthbound.app/Contents/Info.plist > mac-info.log || true
          log show --last 15m --style compact --predicate 'process == "Hearthbound"' > mac-launch.log || true

      - name: Export app screenshots
        if: always()
        run: |
          for PLATFORM in Test IPad Mac; do
            if [ -d "${PLATFORM}Results.xcresult" ]; then
              xcrun xcresulttool export attachments \
                --path "${PLATFORM}Results.xcresult" \
                --output-path "screenshots/${PLATFORM}"
            fi
          done

      - name: Upload app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            boot.log
            build.log
            test.log
            ipad-test.log
            mac-test.log
            mac-info.log
            mac-launch.log
